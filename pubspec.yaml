name: leopard_cat_dashboard
description: Leopard Cat Camera Trap Research Dashboard
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  file_picker: ^13.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/events/
    - assets/data/dashboard_events.csv
    - assets/splash_camera_trap.png